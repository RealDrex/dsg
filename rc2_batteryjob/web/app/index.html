<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
    :root { --c1: #ff5a1f; --c1-rgb: 255, 90, 31; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #0e0f12; color: #e5e7eb; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; overflow: hidden; }
    .app { height: 100%; display: flex; flex-direction: column; }
    header { display: flex; align-items: center; gap: 12px; padding: 18px 22px; border-bottom: 1px solid #1f2128; }
    header .icon { width: 40px; height: 40px; border-radius: 12px; background: var(--c1); display: grid; place-items: center; color: #fff; font-size: 18px; }
    header h1 { font-size: 18px; font-weight: 700; }
    header .status { margin-left: auto; font-size: 12px; padding: 5px 10px; border-radius: 999px; background: #1f2128; color: #9ca3af; }
    header .status.on { background: rgba(34,197,94,0.15); color: #4ade80; }
    header .close { background: none; border: none; color: #9ca3af; font-size: 18px; cursor: pointer; }
    main { flex: 1; overflow-y: auto; padding: 18px 22px; display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; align-content: start; }
    @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
    .card { background: #16171c; border: 1px solid #22242c; border-radius: 16px; padding: 16px; }
    .card h2 { font-size: 14px; color: #9ca3af; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .card h2 i { color: var(--c1); }
    .empty { color: #6b7280; font-size: 14px; text-align: center; padding: 18px 0; }
    .big { font-size: 20px; font-weight: 700; color: #fff; }
    .muted { color: #9ca3af; font-size: 13px; }
    .steps { list-style: none; margin-top: 14px; display: flex; flex-direction: column; gap: 6px; }
    .steps li { display: flex; align-items: center; gap: 10px; font-size: 14px; color: #6b7280; }
    .steps li i { width: 18px; text-align: center; }
    .steps li.done { color: #4ade80; }
    .steps li.current { color: #fff; font-weight: 600; }
    .steps li.current i { color: var(--c1); }
    .actions { display: flex; gap: 8px; margin-top: 14px; }
    button.btn { flex: 1; border: none; border-radius: 10px; padding: 10px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; background: #22242c; color: #e5e7eb; }
    button.btn.primary { background: var(--c1); color: #fff; }
    button.btn.danger { background: rgba(239,68,68,0.15); color: #f87171; }
    button.btn:hover { filter: brightness(1.12); }
    .contract { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px; background: #1b1c22; margin-bottom: 8px; }
    .contract .info { flex: 1; }
    .contract .title { font-weight: 700; color: #fff; font-size: 14px; }
    .contract .bonus { color: #4ade80; font-weight: 700; font-size: 14px; }
    .contract button { flex: none; width: auto; padding: 8px 14px; }
    .bar { height: 8px; border-radius: 4px; background: #22242c; overflow: hidden; margin: 10px 0 6px; }
    .bar i { display: block; height: 100%; background: var(--c1); }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat { background: #1b1c22; border-radius: 12px; padding: 12px; }
    .stat b { display: block; font-size: 20px; color: #fff; }
    .stat span { font-size: 12px; color: #9ca3af; }
    .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #ef4444; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; display: none; }
</style>
</head>
<body>
<div class="app">
    <header>
        <div class="icon"><i class="fa-solid fa-car-battery"></i></div>
        <h1>Battery Assist</h1>
        <div class="status" id="status">Off duty</div>
        <button class="close" id="close"><i class="fa-solid fa-xmark"></i></button>
    </header>
    <main>
        <div>
            <div class="card" id="callCard"></div>
        </div>
        <div style="display:flex;flex-direction:column;gap:16px">
            <div class="card" id="contractCard"></div>
            <div class="card">
                <h2><i class="fa-solid fa-chart-simple"></i>Your stats</h2>
                <div class="stats" id="stats"></div>
            </div>
        </div>
    </main>
</div>
<div class="toast" id="toast"></div>

<script>
    const RES = location.host.replace('cfx-nui-', '') || 'rc2_batteryjob';
    const $ = (id) => document.getElementById(id);
    const post = (name, body = {}) => fetch(`https://${RES}/${name}`, { method: 'POST', body: JSON.stringify(body) }).then(r => r.json()).catch(() => null);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    const STEPS = [
        ['assigned', 'fa-location-dot', 'Drive to the call'],
        ['talked', 'fa-comments', 'Talk to the customer'],
        ['hood', 'fa-car', 'Open the hood'],
        ['red', 'fa-plus', 'Connect positive (red)'],
        ['black', 'fa-minus', 'Connect negative (black)'],
        ['running', 'fa-bolt', 'Start charging from the screen'],
        ['started', 'fa-key', 'Vehicle started'],
        ['disconnected', 'fa-plug-circle-xmark', 'Disconnect the cables'],
        ['stored', 'fa-box', 'Store the cables in the van'],
    ];

    let state = null;
    let clock = null;

    function toast(text) {
        $('toast').textContent = text;
        $('toast').style.display = 'block';
        setTimeout(() => $('toast').style.display = 'none', 3000);
    }

    function fmt(sec) {
        sec = Math.max(0, Math.floor(sec));
        return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
    }

    function renderCall() {
        const card = $('callCard');
        if (!state || !state.onShift) {
            card.innerHTML = `<h2><i class="fa-solid fa-briefcase"></i>Shift</h2>
                <div class="empty">Start your shift at the depot to receive calls</div>
                <div class="actions"><button class="btn primary" data-act="depot"><i class="fa-solid fa-map-pin"></i> Mark depot</button></div>`;
            return;
        }

        const call = state.call;
        if (!call) {
            const wait = state.nextCallIn != null ? `Next call in <b id="countdown">${fmt(state.nextCallIn)}</b>` : 'Waiting for a call...';
            card.innerHTML = `<h2><i class="fa-solid fa-tower-broadcast"></i>Dispatch</h2><div class="empty">${wait}</div>`;
            return;
        }

        const current = STEPS.findIndex(s => s[0] === call.step);
        const steps = STEPS.slice(1).map(([key, icon, label], i) => {
            const idx = i + 1;
            const cls = idx <= current ? 'done' : idx === current + 1 ? 'current' : '';
            return `<li class="${cls}"><i class="fa-solid ${idx <= current ? 'fa-check' : icon}"></i>${label}</li>`;
        }).join('');

        card.innerHTML = `<h2><i class="fa-solid fa-triangle-exclamation"></i>Current call</h2>
            <div class="big">${esc(call.customer)}</div>
            <div class="muted">${esc(call.area)} · Dead battery</div>
            <ul class="steps">${steps}</ul>
            <div class="actions">
                <button class="btn primary" data-act="call"><i class="fa-solid fa-route"></i> Set waypoint</button>
                <button class="btn danger" data-act="cancelCall">Cancel call</button>
            </div>`;
    }

    function renderContract() {
        const card = $('contractCard');
        const head = `<h2><i class="fa-solid fa-file-signature"></i>Contracts</h2>`;

        if (state && state.contract) {
            const c = state.contract;
            const left = c.endsAt - c.now;
            card.innerHTML = `${head}
                <div class="big">${esc(c.label)}</div>
                <div class="bar"><i style="width:${(c.done / c.calls) * 100}%"></i></div>
                <div class="muted">${c.done} / ${c.calls} calls · <b id="contractLeft">${fmt(left)}</b> left</div>
                <div class="actions"><button class="btn danger" data-act="cancelContract">Cancel contract</button></div>`;
            return;
        }

        const list = (state && state.contracts || []).map(c => `
            <div class="contract">
                <div class="info"><div class="title">${esc(c.label)}</div><div class="muted">${esc(c.description)}</div></div>
                <div class="bonus">$${c.bonus}</div>
                <button class="btn primary" data-act="accept" data-id="${esc(c.id)}" ${state && state.onShift ? '' : 'disabled'}>Accept</button>
            </div>`).join('');

        card.innerHTML = head + (list || '<div class="empty">No contracts available</div>');
    }

    function renderStats() {
        const s = (state && state.stats) || { calls: 0, earned: 0, contracts: 0 };
        const session = (state && state.session) || { calls: 0, earned: 0 };
        $('stats').innerHTML = `
            <div class="stat"><b>${session.calls}</b><span>Shift calls</span></div>
            <div class="stat"><b>$${session.earned}</b><span>Shift earnings</span></div>
            <div class="stat"><b>${s.calls}</b><span>Total calls</span></div>
            <div class="stat"><b>$${s.earned}</b><span>Total earnings</span></div>`;
    }

    function render() {
        $('status').textContent = state && state.onShift ? 'On duty' : 'Off duty';
        $('status').classList.toggle('on', !!(state && state.onShift));
        renderCall();
        renderContract();
        renderStats();

        clearInterval(clock);
        const started = Date.now();
        clock = setInterval(() => {
            const passed = (Date.now() - started) / 1000;
            if ($('countdown') && state.nextCallIn != null) $('countdown').textContent = fmt(state.nextCallIn - passed);
            if ($('contractLeft') && state.contract) $('contractLeft').textContent = fmt(state.contract.endsAt - state.contract.now - passed);
        }, 1000);
    }

    async function refresh() {
        const s = await post('app:getState');
        if (s) { state = s; render(); }
    }

    document.addEventListener('click', async (e) => {
        const el = e.target.closest('[data-act]');
        if (!el) return;
        const act = el.dataset.act;
        let res;
        if (act === 'depot') res = await post('app:waypoint', { target: 'depot' });
        if (act === 'call') res = await post('app:waypoint', { target: 'call' });
        if (act === 'cancelCall') res = await post('app:cancelCall');
        if (act === 'accept') res = await post('app:acceptContract', { id: el.dataset.id });
        if (act === 'cancelContract') res = await post('app:cancelContract');
        if (res && res.ok === false && res.error) toast(res.error);
        refresh();
    });

    $('close').onclick = () => window.parent.postMessage({ action: 'phone:close' }, '*');

    window.addEventListener('message', (e) => {
        const msg = e.data;
        if (!msg) return;
        if (msg.action === 'phone:message' && msg.data && msg.data.type === 'state') {
            state = msg.data.data;
            render();
        }
        if (msg.action === 'phone:theme' && msg.data && msg.data.color1) {
            document.documentElement.style.setProperty('--c1', msg.data.color1);
        }
    });

    refresh();
</script>
</body>
</html>
