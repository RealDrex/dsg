<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ot-hud</title>
    <meta name="author" content="drex" />
    <link rel="stylesheet" href="./fonts.css" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div id="app" class="hud hidden">
      <div id="compass" class="compass"></div>
      <div id="notifications" class="notifications"></div>
      <div class="left-stack">
        <div id="minimap" class="minimap"></div>
        <div class="mm-head"><svg viewBox="0 0 190 24"><path d="M46 1.5 L76 22 L190 22"></path></svg><div id="clock" class="mm-clock"><span class="d"></span><span class="t"></span></div></div>
        <div id="player" class="player"></div>
      </div>
      <div id="aircraft" class="aircraft"></div>
      <div class="hud-right">
        <div id="weapon" class="weapon"></div>
        <div id="vehicle" class="vehicle"></div>
      </div>
    </div>

    <script src="./js/icons.js"></script>
    <script src="./js/blips.js"></script>
    <script src="./js/store.js"></script>
    <script src="./js/compass.js"></script>
    <script src="./js/minimap.js"></script>
    <script src="./js/player.js"></script>
    <script src="./js/weapon.js"></script>
    <script src="./js/vehicle.js"></script>
    <script src="./js/aircraft.js"></script>
    <script src="./js/notify.js"></script>
    <script src="./js/main.js"></script>
  </body>
</html>
