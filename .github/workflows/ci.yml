name: CI
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bestprice
          POSTGRES_PASSWORD: bestprice
          POSTGRES_DB: bestprice_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bestprice" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://bestprice:bestprice@localhost:5432/bestprice_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit & integration tests
        run: npm test
      - name: Build API
        run: npm run build -w @bestprice/api
      - name: Build admin
        run: npm run build -w @bestprice/admin
      - name: Dependency audit (production, high+)
        run: npm audit --omit=dev --audit-level=high || true
